<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src {{cspSource}} 'unsafe-inline'; script-src 'nonce-{{nonce}}'; img-src {{cspSource}} https: data:;">
    <title>msAgent Fix Details</title>
    <link nonce="{{nonce}}" rel="stylesheet" href="{{styleUri}}">
</head>
<body>
    <div id="app">
        <header class="session-strip">
            <div class="strip-left">
                <span id="status-pill" class="status-pill is-waiting">
                    <span class="pulse"></span>
                    <span id="status-label">等待中</span>
                </span>
                <span id="session-target" class="strip-target" title="">准备开始下一次修复</span>
            </div>
            <div class="strip-right">
                <span id="meta-elapsed" class="meta-chip" title="耗时">00:00</span>
                <span id="queue-badge" class="meta-chip hidden">队列 0</span>
                <button id="stopBtn" class="strip-btn hidden" type="button">Pause</button>
                <button id="cancelBtn" class="strip-btn is-danger hidden" type="button">Cancel</button>
            </div>
        </header>

        <main id="messages" class="workspace">
            <section id="status-card" class="card status-card">
                <div class="card-head">
                    <span class="card-title">Status</span>
                    <span id="session-phase" class="card-meta">Idle</span>
                </div>
                <div class="card-body">
                    <div class="kv-row">
                        <span class="kv-label">Backend</span>
                        <span id="meta-backend" class="kv-value">-</span>
                    </div>
                    <div class="kv-row">
                        <span class="kv-label">Mode</span>
                        <span id="meta-mode" class="kv-value">-</span>
                    </div>
                    <div class="kv-row">
                        <span class="kv-label">Model</span>
                        <span id="meta-model" class="kv-value">-</span>
                    </div>
                    <div class="kv-row">
                        <span class="kv-label">Session</span>
                        <span id="meta-session" class="kv-value" title="">-</span>
                    </div>
                </div>
            </section>

            <section id="steps-card" class="card steps-card hidden">
                <div class="card-head">
                    <span class="card-title">Steps</span>
                    <span id="steps-meta" class="card-meta">0 / 0</span>
                </div>
                <ol id="steps-list" class="steps-list"></ol>
            </section>

            <section id="files-card" class="card files-card hidden">
                <div class="card-head">
                    <span class="card-title">Modified Files</span>
                    <span id="files-meta" class="card-meta">0 files</span>
                </div>
                <div id="files-list" class="files-list"></div>
            </section>

            <section id="explanation-card" class="card explanation-card hidden">
                <div class="card-head">
                    <span class="card-title">Explanation</span>
                    <span id="explanation-meta" class="card-meta">Streaming…</span>
                </div>
                <div id="explanation-body" class="explanation-body"></div>
            </section>

            <section id="waiting-indicator" class="card empty-card">
                <div class="spinner"></div>
                <div class="empty-title">等待 Agent 开始</div>
                <div class="empty-detail">执行修复命令后，这里会立即显示当前动作和结果。</div>
            </section>

            <details id="technical-details" class="raw-log">
                <summary>Technical details</summary>
                <div id="message-container" class="raw-log-body"></div>
            </details>
        </main>
    </div>

    <script nonce="{{nonce}}" src="{{scriptUri}}"></script>
</body>
</html>
