<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src {{cspSource}} 'unsafe-inline'; script-src 'nonce-{{nonce}}'; img-src {{cspSource}} https: data:;">
    <title>msAgent Fix Details</title>
    <link nonce="{{nonce}}" rel="stylesheet" href="{{styleUri}}">
</head>
<body>
    <div id="app">
        <main id="messages" class="workspace">
            <section id="status-card" class="card status-card is-collapsible" data-card-id="status">
                <div class="card-head" data-card-toggle="status" title="Double-click to collapse or expand">
                    <div class="card-head-left">
                        <span class="card-icon" aria-hidden="true">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
                        </span>
                        <span class="card-title">Info</span>
                    </div>
                    <span class="card-chevron" aria-hidden="true"></span>
                </div>
                <div class="card-body">
                    <div class="kv-row">
                        <span class="kv-label">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="2"/><rect x="9" y="9" width="6" height="6"/></svg>
                            Backend
                        </span>
                        <span id="meta-backend" class="kv-value is-green">-</span>
                    </div>
                    <div class="kv-row">
                        <span class="kv-label">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M14.7 6.3a1 1 0 000 1.4l1.6 1.6a1 1 0 001.4 0l3.77-3.77a6 6 0 01-7.94 7.94l-6.91 6.91a2.12 2.12 0 01-3-3l6.91-6.91a6 6 0 017.94-7.94l-3.76 3.76z"/></svg>
                            Mode
                        </span>
                        <span id="meta-mode" class="kv-value">-</span>
                    </div>
                    <div class="kv-row">
                        <span class="kv-label">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 8v4l3 2"/></svg>
                            Model
                        </span>
                        <span id="meta-model" class="kv-value is-blue">-</span>
                    </div>
                    <div id="elapsed-row" class="kv-row hidden">
                        <span class="kv-label">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="12" cy="12" r="10"/><polyline points="12 7 12 12 15 14"/></svg>
                            Elapsed
                        </span>
                        <span id="meta-elapsed" class="kv-value">00:00</span>
                    </div>
                    <div id="queue-row" class="kv-row hidden">
                        <span class="kv-label">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><circle cx="3.5" cy="6" r="1.5"/><circle cx="3.5" cy="12" r="1.5"/><circle cx="3.5" cy="18" r="1.5"/></svg>
                            Queue
                        </span>
                        <span id="queue-badge" class="kv-value is-yellow">0</span>
                    </div>
                    <div id="status-progress" class="progress-track hidden">
                        <div class="progress-fill"></div>
                    </div>
                </div>
            </section>

            <section id="tasks-card" class="card tasks-card hidden is-collapsible" data-card-id="tasks">
                <div class="card-head" data-card-toggle="tasks" title="Double-click to collapse or expand">
                    <div class="card-head-left">
                        <span class="card-icon" aria-hidden="true">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
                        </span>
                        <span class="card-title">Tasks</span>
                    </div>
                    <span class="card-chevron" aria-hidden="true"></span>
                    <span id="tasks-meta" class="card-meta">0 in progress · 0 completed</span>
                    <button id="tasks-pause-btn" class="action-btn tasks-pause-btn hidden" type="button">Pause</button>
                </div>
                <div class="card-body tasks-body">
                    <div id="tasks-running-group" class="tasks-group hidden">
                        <div class="tasks-group-head">
                            <span class="tasks-group-title">In progress</span>
                            <span id="tasks-running-count" class="tasks-group-count">0</span>
                        </div>
                        <ul id="tasks-running-list" class="tasks-list"></ul>
                    </div>
                    <div id="tasks-queued-group" class="tasks-group hidden">
                        <div class="tasks-group-head">
                            <span class="tasks-group-title">Queued</span>
                            <span id="tasks-queued-count" class="tasks-group-count">0</span>
                        </div>
                        <ul id="tasks-queued-list" class="tasks-list"></ul>
                    </div>
                    <div id="tasks-completed-group" class="tasks-group hidden is-group-collapsible" data-group-id="completed">
                        <div class="tasks-group-head" data-group-toggle="completed" title="Double-click to collapse or expand">
                            <span class="tasks-group-chevron" aria-hidden="true"></span>
                            <span class="tasks-group-title">Completed</span>
                            <span id="tasks-completed-count" class="tasks-group-count">0</span>
                        </div>
                        <ul id="tasks-completed-list" class="tasks-list"></ul>
                    </div>
                    <div id="tasks-failed-group" class="tasks-group hidden is-group-collapsible" data-group-id="failed">
                        <div class="tasks-group-head" data-group-toggle="failed" title="Double-click to collapse or expand">
                            <span class="tasks-group-chevron" aria-hidden="true"></span>
                            <span class="tasks-group-title">Failed</span>
                            <span id="tasks-failed-count" class="tasks-group-count">0</span>
                        </div>
                        <ul id="tasks-failed-list" class="tasks-list"></ul>
                    </div>
                    <div id="tasks-cancelled-group" class="tasks-group hidden is-group-collapsible" data-group-id="cancelled">
                        <div class="tasks-group-head" data-group-toggle="cancelled" title="Double-click to collapse or expand">
                            <span class="tasks-group-chevron" aria-hidden="true"></span>
                            <span class="tasks-group-title">Cancelled</span>
                            <span id="tasks-cancelled-count" class="tasks-group-count">0</span>
                        </div>
                        <ul id="tasks-cancelled-list" class="tasks-list"></ul>
                    </div>
                </div>
            </section>

            <div id="idle-hint" class="idle-hint">
                <div class="idle-title">No active session</div>
                <div class="idle-detail">Run a fix to see tasks, live progress, and diffs here.</div>
            </div>
        </main>
        <button id="jump-latest" class="jump-latest" type="button" aria-label="Jump to latest">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><polyline points="6 9 12 15 18 9"/></svg>
            <span>Jump to latest</span>
        </button>
    </div>

    <script nonce="{{nonce}}" src="{{scriptUri}}"></script>
</body>
</html>
