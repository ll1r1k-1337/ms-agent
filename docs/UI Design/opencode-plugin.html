<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OpenCode — VS Code Plugin</title>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0d0d0d;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: 'SF Pro Text', -apple-system, BlinkMacSystemFont, sans-serif;
  }

  /* VS Code colors */
  :root {
    --vsc-bg: #1e1e1e;
    --vsc-sidebar: #252526;
    --vsc-panel-header: #2d2d30;
    --vsc-border: #3e3e42;
    --vsc-fg: #cccccc;
    --vsc-fg-muted: #6e6e6e;
    --vsc-fg-dim: #3e3e42;
    --vsc-accent: #0078d4;
    --vsc-statusbar: #007acc;
    --vsc-editor: #1e1e1e;
    --vsc-tab-active: #1e1e1e;
    --vsc-tab-bg: #2d2d30;
    --vsc-input: #3c3c3c;
    --vsc-hover: #2a2d2e;
    --oc-green: #4ec9b0;
    --oc-yellow: #dcdcaa;
    --oc-orange: #ce9178;
    --oc-blue: #569cd6;
    --oc-purple: #c586c0;
    --oc-red: #f44747;
  }

  .vscode-window {
    width: 1100px;
    height: 680px;
    background: var(--vsc-bg);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    font-size: 13px;
    color: var(--vsc-fg);
  }

  /* Activity bar */
  .activity-bar {
    position: absolute;
    left: 0;
    top: 0;
    bottom: 22px;
    width: 48px;
    background: #333333;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding-top: 8px;
    gap: 4px;
    z-index: 10;
  }
  .activity-icon {
    width: 48px;
    height: 48px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #858585;
    cursor: pointer;
    position: relative;
  }
  .activity-icon.active {
    color: #ffffff;
  }
  .activity-icon.active::before {
    content: '';
    position: absolute;
    left: 0;
    top: 8px;
    bottom: 8px;
    width: 2px;
    background: #ffffff;
  }
  .activity-icon svg { width: 24px; height: 24px; }

  /* Layout */
  .vscode-body {
    flex: 1;
    display: flex;
    position: relative;
    overflow: hidden;
  }
  .vscode-sidebar {
    width: 260px;
    margin-left: 48px;
    background: var(--vsc-sidebar);
    border-right: 1px solid var(--vsc-border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .vscode-main {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* Tabs */
  .tab-bar {
    height: 35px;
    background: var(--vsc-tab-bg);
    display: flex;
    align-items: stretch;
    border-bottom: 1px solid var(--vsc-border);
  }
  .tab {
    padding: 0 20px;
    display: flex;
    align-items: center;
    gap: 6px;
    color: #969696;
    border-right: 1px solid var(--vsc-border);
    font-size: 13px;
    cursor: pointer;
    white-space: nowrap;
  }
  .tab.active {
    background: var(--vsc-tab-active);
    color: #ffffff;
    border-top: 1px solid var(--vsc-accent);
    margin-top: -1px;
  }
  .tab-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #cccccc;
    opacity: 0.5;
  }

  /* Editor */
  .editor {
    flex: 1;
    background: var(--vsc-editor);
    padding: 16px 0;
    font-family: 'Menlo', 'Courier New', monospace;
    font-size: 13px;
    line-height: 19px;
    overflow: hidden;
    position: relative;
  }
  .editor-line {
    display: flex;
    padding: 0 20px 0 60px;
    position: relative;
  }
  .line-num {
    position: absolute;
    left: 20px;
    color: #4e4e4e;
    user-select: none;
    width: 30px;
    text-align: right;
  }
  .kw { color: #569cd6; }
  .fn { color: #dcdcaa; }
  .str { color: #ce9178; }
  .cm { color: #6a9955; }
  .ty { color: #4ec9b0; }
  .nm { color: #9cdcfe; }

  /* Sidebar panel */
  .sidebar-section-header {
    height: 22px;
    display: flex;
    align-items: center;
    padding: 0 8px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--vsc-fg);
    cursor: pointer;
    background: var(--vsc-panel-header);
    border-bottom: 1px solid var(--vsc-border);
    gap: 4px;
    flex-shrink: 0;
  }
  .sidebar-section-header svg { opacity: 0.7; }

  /* OpenCode panel */
  .oc-panel {
    flex: 1;
    overflow-y: auto;
    padding: 12px 0;
  }

  .oc-status-card {
    margin: 0 8px 8px;
    border-radius: 4px;
    background: var(--vsc-panel-header);
    border: 1px solid var(--vsc-border);
    overflow: hidden;
  }
  .oc-status-card-header {
    padding: 8px 10px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid var(--vsc-border);
  }
  .oc-status-card-header-left {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: #888;
  }
  .oc-status-card-body {
    padding: 10px;
    display: flex;
    flex-direction: column;
    gap: 7px;
  }

  /* Status pill */
  .status-pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    font-weight: 500;
    padding: 3px 10px;
    border-radius: 100px;
  }
  .status-pill.running {
    background: rgba(78, 201, 176, 0.12);
    color: #4ec9b0;
    border: 1px solid rgba(78, 201, 176, 0.3);
  }
  .status-pill.idle {
    background: rgba(255,255,255,0.05);
    color: #888;
    border: 1px solid var(--vsc-border);
  }
  .status-pill.error {
    background: rgba(244, 71, 71, 0.1);
    color: #f44747;
    border: 1px solid rgba(244, 71, 71, 0.3);
  }
  .status-pill.waiting {
    background: rgba(220, 220, 170, 0.1);
    color: #dcdcaa;
    border: 1px solid rgba(220, 220, 170, 0.25);
  }

  .pulse {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: currentColor;
    animation: pulse 1.8s ease-in-out infinite;
  }
  .pulse.static { animation: none; }
  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.4; transform: scale(0.85); }
  }

  .oc-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 12px;
  }
  .oc-label {
    color: #666;
    display: flex;
    align-items: center;
    gap: 5px;
  }
  .oc-value {
    color: #ccc;
    font-family: 'Menlo', monospace;
    font-size: 11.5px;
  }
  .oc-value.accent { color: #4ec9b0; }
  .oc-value.blue { color: #569cd6; }
  .oc-value.yellow { color: #dcdcaa; }

  /* Progress bar */
  .progress-track {
    height: 2px;
    background: var(--vsc-dim);
    border-radius: 1px;
    overflow: hidden;
    background: rgba(255,255,255,0.08);
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, #4ec9b0, #569cd6);
    border-radius: 1px;
    animation: progress-shimmer 2s ease-in-out infinite;
  }
  @keyframes progress-shimmer {
    0% { width: 35%; opacity: 0.7; }
    50% { width: 72%; opacity: 1; }
    100% { width: 35%; opacity: 0.7; }
  }

  /* Step list */
  .step-list {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .step-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 5px 10px;
    font-size: 12px;
    color: #888;
    border-radius: 3px;
  }
  .step-item.done { color: #4ec9b0; }
  .step-item.active { color: #ccc; background: rgba(255,255,255,0.04); }
  .step-item.pending { color: #555; }
  .step-icon {
    width: 14px;
    height: 14px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .step-icon svg { width: 12px; height: 12px; }

  /* File list */
  .file-list {
    display: flex;
    flex-direction: column;
    gap: 0;
  }
  .file-item {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 3px 10px;
    font-size: 12px;
    font-family: 'Menlo', monospace;
    color: #888;
    cursor: pointer;
  }
  .file-item:hover { background: var(--vsc-hover); color: #ccc; }
  .file-item.modified { color: #e2c08d; }
  .file-item svg { width: 14px; height: 14px; flex-shrink: 0; opacity: 0.7; }

  /* Token bar */
  .token-bar {
    margin: 0 8px 8px;
  }
  .token-bar-track {
    height: 4px;
    background: rgba(255,255,255,0.07);
    border-radius: 2px;
    overflow: hidden;
    margin-top: 5px;
  }
  .token-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, #4ec9b0 0%, #569cd6 60%, #c586c0 100%);
    border-radius: 2px;
    width: 31%;
  }

  /* Status bar */
  .vscode-statusbar {
    height: 22px;
    background: var(--vsc-statusbar);
    display: flex;
    align-items: center;
    padding: 0 8px;
    gap: 0;
    font-size: 12px;
    color: rgba(255,255,255,0.9);
  }
  .sb-item {
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 0 8px;
    height: 100%;
    cursor: pointer;
    white-space: nowrap;
  }
  .sb-item:hover { background: rgba(255,255,255,0.15); }
  .sb-item svg { width: 14px; height: 14px; }
  .sb-spacer { flex: 1; }
  .sb-oc {
    display: flex;
    align-items: center;
    gap: 5px;
    padding: 0 10px;
    height: 100%;
    background: rgba(0,0,0,0.2);
    cursor: pointer;
    font-size: 11.5px;
    font-weight: 500;
  }
  .sb-oc:hover { background: rgba(0,0,0,0.35); }
  .sb-oc .pulse { width: 6px; height: 6px; }

  /* Explorer sidebar */
  .explorer-tree {
    padding: 4px 0;
    font-size: 13px;
  }
  .tree-item {
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 2px 8px;
    cursor: pointer;
    color: #ccc;
    white-space: nowrap;
    overflow: hidden;
  }
  .tree-item:hover { background: var(--vsc-hover); }
  .tree-item.indent-1 { padding-left: 20px; }
  .tree-item.indent-2 { padding-left: 36px; }
  .tree-item.active { background: #094771; color: #fff; }
  .tree-item svg { width: 16px; height: 16px; flex-shrink: 0; }
  .tree-label { overflow: hidden; text-overflow: ellipsis; }

  /* Breadcrumb */
  .breadcrumb {
    height: 22px;
    display: flex;
    align-items: center;
    padding: 0 14px;
    gap: 4px;
    font-size: 12px;
    color: #858585;
    border-bottom: 1px solid var(--vsc-border);
    background: var(--vsc-editor);
  }
  .breadcrumb span { cursor: pointer; }
  .breadcrumb span:hover { color: #ccc; }
  .breadcrumb-sep { color: #4e4e4e; }

  /* Minimap */
  .minimap {
    width: 60px;
    background: #1a1a1a;
    opacity: 0.6;
    overflow: hidden;
    flex-shrink: 0;
  }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef } = React;

// SVG Icons
const Icons = {
  files: <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5"><path d="M13 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V9z"/><polyline points="13 2 13 9 20 9"/></svg>,
  search: <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>,
  git: <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5"><circle cx="18" cy="18" r="3"/><circle cx="6" cy="6" r="3"/><path d="M13 6h3a2 2 0 012 2v7"/><line x1="6" y1="9" x2="6" y2="21"/></svg>,
  extensions: <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5"><rect x="2" y="7" width="9" height="9" rx="1"/><path d="M11 12h4l-2-2m0 0l-2 2m2-2v6"/><rect x="13" y="2" width="9" height="9" rx="1"/></svg>,
  opencode: <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/><line x1="12" y1="4" x2="12" y2="20" strokeDasharray="2 2"/></svg>,
  check: <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><polyline points="20 6 9 17 4 12"/></svg>,
  spin: <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/></svg>,
  dot: <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="5"/></svg>,
  file: <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5"><path d="M13 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V9z"/><polyline points="13 2 13 9 20 9"/></svg>,
  folder: <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5"><path d="M22 19a2 2 0 01-2 2H4a2 2 0 01-2-2V5a2 2 0 012-2h5l2 3h9a2 2 0 012 2z"/></svg>,
  chevron: <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><polyline points="9 18 15 12 9 6"/></svg>,
  chevronDown: <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><polyline points="6 9 12 15 18 9"/></svg>,
  tool: <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5"><path d="M14.7 6.3a1 1 0 000 1.4l1.6 1.6a1 1 0 001.4 0l3.77-3.77a6 6 0 01-7.94 7.94l-6.91 6.91a2.12 2.12 0 01-3-3l6.91-6.91a6 6 0 017.94-7.94l-3.76 3.76z"/></svg>,
  lightning: <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>,
  clock: <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>,
  cpu: <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5"><rect x="4" y="4" width="16" height="16" rx="2"/><rect x="9" y="9" width="6" height="6"/><line x1="9" y1="1" x2="9" y2="4"/><line x1="15" y1="1" x2="15" y2="4"/><line x1="9" y1="20" x2="9" y2="23"/><line x1="15" y1="20" x2="15" y2="23"/><line x1="20" y1="9" x2="23" y2="9"/><line x1="20" y1="14" x2="23" y2="14"/><line x1="1" y1="9" x2="4" y2="9"/><line x1="1" y1="14" x2="4" y2="14"/></svg>,
  xmark: <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>,
  warning: <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5"><path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>,
};

const STATES = ['running', 'idle', 'waiting', 'error'];
const STATE_LABELS = { running: 'Running', idle: 'Idle', waiting: 'Waiting', error: 'Error' };

const steps = [
  { id: 1, label: 'Read src/server/index.ts', done: true },
  { id: 2, label: 'Read src/routes/api.ts', done: true },
  { id: 3, label: 'Edit src/server/middleware.ts', active: true },
  { id: 4, label: 'Run: tsc --noEmit', pending: true },
  { id: 5, label: 'Write tests', pending: true },
];

const modifiedFiles = [
  { name: 'middleware.ts', path: 'src/server/' },
  { name: 'api.ts', path: 'src/routes/' },
];

function SpinIcon() {
  return (
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"
      style={{width:12,height:12,animation:'spin 1s linear infinite'}}>
      <path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/>
    </svg>
  );
}

function StepIcon({ step }) {
  if (step.done) return <span style={{color:'#4ec9b0'}}><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" style={{width:12,height:12}}><polyline points="20 6 9 17 4 12"/></svg></span>;
  if (step.active) return <SpinIcon />;
  return <span style={{color:'#555'}}>·</span>;
}

function OcPanel({ status }) {
  const isRunning = status === 'running';
  const isIdle = status === 'idle';
  const isWaiting = status === 'waiting';
  const isError = status === 'error';

  return (
    <div className="oc-panel">
      {/* Status */}
      <div className="oc-status-card">
        <div className="oc-status-card-header">
          <div className="oc-status-card-header-left">
            {Icons.lightning}
            Status
          </div>
          <span className={`status-pill ${status}`}>
            <span className={`pulse ${isIdle || isError ? 'static' : ''}`}></span>
            {STATE_LABELS[status]}
          </span>
        </div>
        <div className="oc-status-card-body">
          <div className="oc-row">
            <span className="oc-label">{Icons.cpu} Model</span>
            <span className="oc-value blue">claude-3-7-sonnet</span>
          </div>
          <div className="oc-row">
            <span className="oc-label">{Icons.clock} Session</span>
            <span className="oc-value">12m 43s</span>
          </div>
          <div className="oc-row">
            <span className="oc-label">{Icons.tool} Tools</span>
            <span className="oc-value accent">read, edit, bash</span>
          </div>
          {isRunning && (
            <div>
              <div style={{marginTop:2}}>
                <div className="progress-track">
                  <div className="progress-fill"></div>
                </div>
              </div>
            </div>
          )}
          {isError && (
            <div style={{display:'flex',alignItems:'center',gap:6,color:'#f44747',fontSize:12,padding:'4px 0'}}>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" style={{width:13,height:13}}><path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
              Tool call failed: permission denied
            </div>
          )}
        </div>
      </div>

      {/* Steps */}
      {(isRunning || isWaiting) && (
        <div className="oc-status-card">
          <div className="oc-status-card-header">
            <div className="oc-status-card-header-left">
              {Icons.tool}
              Steps
            </div>
            <span style={{fontSize:11,color:'#666'}}>3 / 5</span>
          </div>
          <div style={{padding:'8px 0'}}>
            <div className="step-list">
              {steps.map(step => (
                <div key={step.id} className={`step-item ${step.done?'done':step.active?'active':'pending'}`}>
                  <div className="step-icon"><StepIcon step={step} /></div>
                  <span style={{fontFamily:'Menlo, monospace', fontSize:11.5}}>{step.label}</span>
                </div>
              ))}
            </div>
          </div>
        </div>
      )}

      {/* Modified files */}
      {(isRunning || isWaiting || isIdle) && modifiedFiles.length > 0 && (
        <div className="oc-status-card">
          <div className="oc-status-card-header">
            <div className="oc-status-card-header-left">
              {Icons.git}
              Modified
            </div>
            <span style={{fontSize:11,color:'#e2c08d'}}>{modifiedFiles.length} file{modifiedFiles.length>1?'s':''}</span>
          </div>
